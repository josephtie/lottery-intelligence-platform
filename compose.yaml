services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${LOTTERY_DATABASE_PASSWORD:?Set LOTTERY_DATABASE_PASSWORD in .env}
      LOTTERY_DATABASE_NAME: ${LOTTERY_DATABASE_NAME:-lottery_platform}
      LOTTERY_DATABASE_USER: ${LOTTERY_DATABASE_USER:-directus}
    ports:
      - "127.0.0.1:${LOTTERY_DATABASE_PORT:-5430}:5432"
    volumes:
      - lottery-db:/var/lib/postgresql/data
      - ./infrastructure/postgres/init-db.sh:/docker-entrypoint-initdb.d/01-init-db.sh:ro
      - ./infrastructure/postgres/migrations:/docker-entrypoint-initdb.d/migrations:ro
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  raw-storage:
    image: pgsty/minio:RELEASE.2026-06-18T00-00-00Z
    command: ["server", "/data", "--address", ":9000", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${LOTTERY_S3_ACCESS_KEY:?Set LOTTERY_S3_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${LOTTERY_S3_SECRET_KEY:?Set LOTTERY_S3_SECRET_KEY in .env}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-19002}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-19003}:9001"
    volumes:
      - lottery-raw-data:/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "lottery_intelligence_platform.api", "--host", "0.0.0.0", "--port", "8091"]
    environment:
      LOTTERY_DATABASE_HOST: postgres
      LOTTERY_DATABASE_PORT: 5432
      LOTTERY_DATABASE_NAME: ${LOTTERY_DATABASE_NAME:-lottery_platform}
      LOTTERY_DATABASE_USER: ${LOTTERY_DATABASE_USER:-directus}
      LOTTERY_DATABASE_PASSWORD: ${LOTTERY_DATABASE_PASSWORD:?Set LOTTERY_DATABASE_PASSWORD in .env}
      LOTTERY_S3_ENDPOINT_URL: http://raw-storage:9000
      LOTTERY_S3_BUCKET: ${LOTTERY_S3_BUCKET:-lottery-raw}
      LOTTERY_S3_REGION: ${LOTTERY_S3_REGION:-us-east-1}
      LOTTERY_S3_ACCESS_KEY: ${LOTTERY_S3_ACCESS_KEY:?Set LOTTERY_S3_ACCESS_KEY in .env}
      LOTTERY_S3_SECRET_KEY: ${LOTTERY_S3_SECRET_KEY:?Set LOTTERY_S3_SECRET_KEY in .env}
      LOTTERY_API_TOKEN: ${LOTTERY_API_TOKEN:-}
    ports:
      - "8091:8091"
    depends_on:
      postgres:
        condition: service_healthy
      raw-storage:
        condition: service_started
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  lottery-db:
  lottery-raw-data:
